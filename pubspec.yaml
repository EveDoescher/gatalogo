name: catlogue
description: "Diário de campo e coleção de gatos encontrados."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.3
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  image: ^4.5.4
  tflite_flutter: ^0.12.1
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  web_socket_channel: ^3.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.19
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.1
  flame: ^1.38.2
  audioplayers: ^6.8.1
  flutter_timezone: ^5.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2+1

flutter:

  uses-material-design: true

  assets:
    - assets/quintal/previews/
    - assets/audio/
    - assets/models/cat_detector.tflite
    - assets/fonts/
    - assets/gatalogo_asset_library/avatars/
    - assets/gatalogo_asset_library/backgrounds/
    - assets/gatalogo_asset_library/branding/
    - assets/gatalogo_asset_library/cats/
    - assets/gatalogo_asset_library/environment/
    - assets/gatalogo_asset_library/flora/
    - assets/gatalogo_asset_library/icons/
    - assets/gatalogo_asset_library/rewards/
    - assets/gatalogo_asset_library/ui/
    - assets/3d_assets/kenney_nature-kit/Isometric/
    - assets/habitat/animal-cat.png
    - assets/habitat/building-type-a.png
    - assets/habitat/building-type-f.png
    - assets/habitat/decor/
    - assets/quintal/production/
    - assets/quintal/ui/
    - assets/quintal/cow/
    - assets/quintal/hen-white/
    - assets/quintal/hen-brown/
    - assets/habitat/cat/
    - assets/habitat/cat_coats/
    - assets/habitat/dog/
    - assets/habitat/bee/
    - assets/habitat/bunny/
    - assets/habitat/chick/
    - assets/habitat/deer/
    - assets/habitat/fox/
    - assets/habitat/beaver/
    - assets/habitat/parrot/
    - assets/habitat/fish/
    - assets/3d_assets/kenney_isometric-roads/png/water.png
    - assets/3d_assets/kenney_isometric-roads/png/dirt.png
